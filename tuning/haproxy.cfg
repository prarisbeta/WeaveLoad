#=====================================================================
# HTTPS
#=====================================================================
frontend https_in
        bind :::443 v4v6 ssl crt /etc/haproxy/ssl/cni.pem crt /etc/haproxy/ssl/isc.pem crt /etc/haproxy/ssl/palapacloud.pem crt /etc/haproxy/ssl/platinum.pem alpn h2,http/1.1 sigalgs ecdsa_secp256r1_sha256:rsa_pss_rsae_sha256:rsa_pkcs1_sha256:ecdsa_secp384r1_sha384:rsa_pss_rsae_sha384:rsa_pkcs1_sha384:rsa_pss_rsae_sha512:rsa_pkcs1_sha512
        # Aplikasi di belakang tahu request aslinya HTTPS (Laravel TrustProxies, CodeIgniter base_url).
        http-request set-header X-Forwarded-Proto https
        capture request header Host len 64
        # Opsional setelah semua situs dipastikan HTTPS-only:
        # http-response set-header Strict-Transport-Security "max-age=31536000"
        use_backend %[req.hdr(host),lower,field(1,:),map(/etc/haproxy/maps/hosts_https.map)]

backend https_appdev
        cookie SERVERID insert indirect nocache
        server node01 192.168.200.108:443 cookie node01 ssl verify none sni str(appdev.cni.net.id) check

# Check HTTPS mengirim SNI (check-sni) -- terbukti UP setelah reload 25-09-2026. Kode 421 di expect
# dulu diperlukan karena check tanpa SNI -> Apache membalas 421 Misdirected.
backend https_oms
        cookie SERVERID insert indirect nocache
        http-check send meth GET uri /health.txt ver HTTP/1.1 hdr Host oms.cni.net.id
        http-check expect rstatus (2|3)[0-9][0-9]|421
        server node01 192.168.200.108:443 inter 3000 rise 2 fall 3 cookie node01 ssl verify none sni str(oms.cni.net.id) check check-sni oms.cni.net.id
        server node02 192.168.200.118:443 inter 3000 rise 2 fall 3 cookie node02 ssl verify none sni str(oms.cni.net.id) check check-sni oms.cni.net.id

backend https_rndweb
        http-check send meth GET uri / ver HTTP/1.1 hdr Host rndweb.cnit.net.id
        http-check expect rstatus ^[234]
        cookie SERVER insert indirect nocache
        server node01 103.31.159.17:443 cookie node01 ssl verify none sni str(rndweb.cnit.net.id) check check-sni rndweb.cnit.net.id
        server node02 116.66.206.13:443 cookie node02 ssl verify none sni str(rndweb.cnit.net.id) check check-sni rndweb.cnit.net.id

backend https_platinum
