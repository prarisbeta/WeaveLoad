#=====================================================================
# haproxy-cni (103.31.159.8) — HAProxy 2.8.12, CentOS 7, 8 vCPU, 3.7 GB
# Versi tuning. Tanda "VERIFY:" = perilaku lama dipertahankan karena
# kemungkinan bug; putuskan setelah hasil cek.
#=====================================================================

global
        # Satu target log saja (sebelumnya 3 target = tiap request dikirim 3x).
        # VERIFY: pastikan rsyslog menerima UDP 514 (imudp) untuk local2.
        log 127.0.0.1:514 local2 info notice
        chroot /var/lib/haproxy
        user haproxy
        group haproxy
        # 'daemon' dihapus: service jalan dengan -Ws (master-worker systemd).

        # Satu socket admin (sebelumnya didefinisikan 2x di path yang sama).
        # expose-fd listeners = reload tanpa putus koneksi; group haproxy = dipakai GUI.
        stats socket /var/lib/haproxy/stats mode 660 group haproxy level admin expose-fd listeners
        stats timeout 60s
        # Status runtime (MAINT/DRAIN/bobot dari GUI) disimpan helper apply sesaat sebelum reload
        # lalu dimuat lagi, supaya reload tidak mengaktifkan kembali server yang sengaja dimatikan.
        # Di luar chroot /var/lib/haproxy dengan sengaja (lihat komentar di
        # deploy/haproxy-gui-apply.sh); dibaca sebelum proses masuk chroot.
        server-state-file /var/lib/haproxy-gui-state/server-state

        maxconn 20000
        # nbthread/cpu-map dihapus: 2.8 otomatis memakai semua 8 CPU (sebelumnya dikunci 4).
        # Proses lama setelah reload dipaksa berhenti (sebelumnya bisa menggantung s/d 10 menit).
        hard-stop-after 15m

        # 32 KB dipertahankan untuk header/cookie besar (SSO). ~2x memori per koneksi dibanding 16 KB.
        tune.bufsize 32768
        tune.maxrewrite 4096

        # 500000 entri = ~100 MB shared memory; 100000 lebih dari cukup untuk trafik ini.
        tune.ssl.cachesize 100000
        tune.ssl.lifetime 600

        ssl-dh-param-file /etc/haproxy/dhparam.pem
        ca-base /etc/ssl/certs
        crt-base /etc/ssl/private

        # Default modern (sebelumnya masih mengizinkan cipher non-PFS RSA+AES/CBC).
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
        ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
        log     global
        mode    http
        option  httplog
        option  dontlognull
        # PERUBAHAN PERFORMA UTAMA: sebelumnya 'http-server-close' => koneksi baru
        # (dan TLS handshake baru ke backend ssl) untuk SETIAP request.
        option  http-keep-alive
        http-reuse safe
        option  forwardfor except 127.0.0.0/8
        option  redispatch
        retries 3
        option  httpchk
        maxconn 20000
        load-server-state-from-file global

        timeout connect         5s
        timeout client          120s
        timeout server          180s
        timeout http-request    10s
        timeout http-keep-alive 5s
        timeout queue           30s
        timeout tunnel          1h
        timeout client-fin      30s
        timeout check           8s

        # inter 10s: ~40 server x GET / -> beban check ke CESIUM tetap kecil; fastinter mempercepat deteksi saat status berubah
        default-server inter 10s fastinter 2s downinter 5s fall 3 rise 2 slowstart 30s maxconn 256

        errorfile 400 /etc/haproxy/errors/400.http
        errorfile 403 /etc/haproxy/errors/403.http
        errorfile 408 /etc/haproxy/errors/408.http
        errorfile 429 /etc/haproxy/errors/429.http
        errorfile 500 /etc/haproxy/errors/500.http
        errorfile 502 /etc/haproxy/errors/502.http
        errorfile 503 /etc/haproxy/errors/503.http
        errorfile 504 /etc/haproxy/errors/504.http

#---------------------------------------------------------------------
# Stats — sementara sampai GUI siap. Hanya dari IP di admin_allow.lst,
# password disimpan sebagai hash (bukan teks polos).
# Buat hash (python2 bawaan CentOS 7):
#   python -c 'import crypt,os,getpass; print(crypt.crypt(getpass.getpass(), "$6$"+os.urandom(8).encode("hex")))'
#---------------------------------------------------------------------
userlist stats_users
        user admin password GANTI_DENGAN_HASH_SHA512

listen stats
        bind *:8088
        http-request deny unless { src -f /etc/haproxy/maps/admin_allow.lst }
        http-request auth realm HAProxy_Stats unless { http_auth(stats_users) }
        stats enable
        stats show-legends
        stats refresh 5s
        stats uri /stats
        stats admin if { http_auth(stats_users) }

#=====================================================================
# HTTP
#=====================================================================
frontend http_in
        # ':::80 v4v6' sudah melayani IPv4 + IPv6; 'bind *:80' terpisah dihapus.
        bind :::80 v4v6
        # Jangan menimpa header dari Cloudflare/proxy di depan.
        http-request set-header X-Forwarded-Proto http unless { req.hdr(x-forwarded-proto) -m found }
        # Host di daftar ini dialihkan ke HTTPS (301). Tambah host tanpa reload:
        #   echo "add acl /etc/haproxy/maps/https_redirect.lst <host>" | nc -U /var/lib/haproxy/stats  (+ tulis ke file)
        http-request redirect scheme https code 301 if { req.hdr(host),lower,field(1,:) -m str -f /etc/haproxy/maps/https_redirect.lst } !{ path_beg /.well-known/acme-challenge/ }
        # 25 ACL + 25 use_backend diganti 1 lookup map (bisa diubah runtime tanpa reload).
        use_backend %[req.hdr(host),lower,field(1,:),map(/etc/haproxy/maps/hosts_http.map)]

