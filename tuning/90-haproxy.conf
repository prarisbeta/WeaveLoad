# /etc/sysctl.d/90-haproxy.conf - terapkan: sysctl --system
# Antrean koneksi masuk (sebelumnya 128: HAProxy maxconn 20000 tapi backlog listen dipotong kernel ke 128)
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 16384
# Port sumber untuk koneksi HAProxy -> backend (mulai 10240 agar tidak bentrok dengan port layanan)
net.ipv4.ip_local_port_range = 10240 65000
# Pakai ulang socket TIME_WAIT untuk koneksi keluar (aman; BUKAN tcp_tw_recycle)
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
# Keepalive TCP lebih cepat mendeteksi klien mati
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
