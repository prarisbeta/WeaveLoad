# /etc/systemd/system/haproxy.service.d/override.conf
# Terapkan: systemctl daemon-reload && systemctl restart haproxy   (RESTART, di jam sepi)
[Service]
# -Ws mendukung notify: systemd tahu kapan HAProxy benar-benar siap
Type=notify
# Config rusak tidak pernah dijalankan / di-reload
ExecStartPre=/usr/sbin/haproxy -f /etc/haproxy/haproxy.cfg -c -q
ExecReload=
ExecReload=/usr/sbin/haproxy -f /etc/haproxy/haproxy.cfg -c -q
ExecReload=/bin/kill -USR2 $MAINPID
Restart=on-failure
RestartSec=2s
SuccessExitStatus=143
LimitNOFILE=100000
